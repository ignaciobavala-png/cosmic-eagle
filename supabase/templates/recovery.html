<!-- Plantilla "Reset Password" de Supabase (Authentication → Email Templates).
     NO se aplica sola: se pega a mano en el dashboard. Asunto:
     Crea tu nueva contraseña — Cosmic Eagle
     Texto de la organización, 03/10 (§6.4). Paleta copiada de src/emails/BaseLayout.tsx. -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
  </head>
  <body style="margin:0;padding:0;background-color:#05125a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#05125a" style="background-color:#05125a;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a1f6e" style="max-width:520px;background-color:#0a1f6e;border:1px solid #2c3e82;border-radius:12px;">
            <tr>
              <td style="padding:36px 32px;font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;color:#fff6eb;">
                <p style="margin:0 0 24px;font-family:'Sorts Mill Goudy',Georgia,serif;font-size:22px;color:#f9d78f;">Cosmic Eagle</p>
                <p style="margin:0 0 28px;font-size:16px;line-height:24px;">Pediste cambiar la contraseña de tu cuenta.</p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" bgcolor="#f9d78f" style="background-color:#f9d78f;border-radius:999px;">
                  <tr>
                    <td style="padding:14px 28px;">
                      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery" style="font-family:Montserrat,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#05125a;text-decoration:none;">Crear contraseña nueva</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:13px;line-height:20px;color:#a9abbf;">Vence en una hora y sirve una sola vez. Si no lo pediste, ignora este mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
